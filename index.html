      const useInViewOnce = (options = {}) => {
        const ref = useRef(null);
        const [visible, setVisible] = useState(false);

        useEffect(() => {
          const node = ref.current;
          if (!node || visible) return;
          if (!("IntersectionObserver" in window)) {
            setVisible(true);
            return;
          }
          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  setVisible(true);
                  observer.disconnect();
                }
              });
            },
            { threshold: 0.2, rootMargin: "0px 0px -10% 0px", ...options },
          );
          observer.observe(node);
          return () => observer.disconnect();
        }, [visible, options.rootMargin, options.threshold]);

        return [ref, visible];
      };

      const revealMotion = (delay = 0) => ({
        initial: { opacity: 0, y: 20, filter: "blur(10px)" },
        animate: { opacity: 1, y: 0, filter: "blur(0px)" },
        transition: { duration: 0.7, ease: "easeOut", delay },
      });

      function BlurText({ as: Component = "h1", text, className = "", delay = 0.5 }) {
        const [ref, visible] = useInViewOnce();
        const words = useMemo(() => text.trim().split(/\s+/), [text]);

        return (
          <Component
            ref={ref}
            className={className}
            aria-label={text}
          >

      function CarShowcase() {
        const [activeCar, setActiveCar] = useState(0);
        const [direction, setDirection] = useState("right");
        const [isTransitioning, setIsTransitioning] = useState(false);
        const [viewportWidth, setViewportWidth] = useState(0);
        const lastInteractionRef = useRef(Date.now());
        const startRef = useRef(null);
        const timeoutRef = useRef(null);
        const viewportRef = useRef(null);
        const activeCarRef = useRef(0);
        const transitionLockRef = useRef(false);

        useEffect(() => {
          activeCarRef.current = activeCar;
        }, [activeCar]);

        useEffect(() => {
          const images = CARS.map(({ image }) => {
            const preload = new Image();
            preload.src = image;
            return preload;
          });

          return () => {
            images.length = 0;
          };
        }, []);

        useLayoutEffect(() => {
          const node = viewportRef.current;
          if (!node) return undefined;

          const measure = () => {
            setViewportWidth(node.clientWidth || 0);
          };

          measure();

          if (typeof ResizeObserver === "undefined") {
            window.addEventListener("resize", measure);
            return () => window.removeEventListener("resize", measure);
          }

          const observer = new ResizeObserver(measure);
          observer.observe(node);
          window.addEventListener("resize", measure);

          return () => {
            observer.disconnect();
            window.removeEventListener("resize", measure);
          };
        }, []);

        useEffect(() => {
          const onKeyDown = (event) => {
            if (event.key === "ArrowRight") {
              event.preventDefault();
              goByStep(1);
            }

            if (event.key === "ArrowLeft") {
              event.preventDefault();
              goByStep(-1);
            }
          };

          window.addEventListener("keydown", onKeyDown);

          const interval = window.setInterval(() => {
            if (Date.now() - lastInteractionRef.current > 8000) {
              goByStep(1);
            }
          }, 6000);

          return () => {
            window.removeEventListener("keydown", onKeyDown);
            window.clearInterval(interval);
          };
        }, []);

        useEffect(() => {
          return () => window.clearTimeout(timeoutRef.current);
        }, []);

        const finishTransition = () => {
          transitionLockRef.current = false;
          window.clearTimeout(timeoutRef.current);
          setIsTransitioning(false);
        };

        const moveTo = (nextIndex, nextDirection) => {
          if (transitionLockRef.current || nextIndex === activeCarRef.current) return;

          lastInteractionRef.current = Date.now();
          transitionLockRef.current = true;
          setDirection(nextDirection);
          activeCarRef.current = nextIndex;
          setActiveCar(nextIndex);
          setIsTransitioning(true);
          window.clearTimeout(timeoutRef.current);
          timeoutRef.current = window.setTimeout(finishTransition, 420);
        };

        const goByStep = (delta) => {
          const current = activeCarRef.current;
          const nextIndex = (current + delta + CARS.length) % CARS.length;
          moveTo(nextIndex, delta > 0 ? "right" : "left");
        };

        const goTo = (index) => {
          const current = activeCarRef.current;
          if (index === current) return;

          const forward = (index - current + CARS.length) % CARS.length;
          const backward = (current - index + CARS.length) % CARS.length;
          moveTo(index, forward <= backward ? "right" : "left");
        };

        const slideWidth = viewportWidth ? Math.round(viewportWidth * 0.6) : 0;
        const slideGap = viewportWidth < 640 ? 12 : 18;
        const stepWidth = viewportWidth ? Math.round(slideWidth * (viewportWidth < 640 ? 0.9 : 0.95) + slideGap) : 0;
        const currentCar = CARS[activeCar];
        const isMobileViewport = viewportWidth > 0 && viewportWidth < 640;

        const resolveOffset = (index) => {
          const raw = index - activeCar;
          let offset = raw;
          const half = CARS.length / 2;

          if (offset > half) offset -= CARS.length;
          if (offset < -half) offset += CARS.length;

          if (Math.abs(offset) === half) {
            offset = direction === "right" ? half : -half;
          }

          return offset;
        };

        const handlePointerDown = (event) => {
          startRef.current = { x: event.clientX, y: event.clientY };
          lastInteractionRef.current = Date.now();
        };

        const handlePointerUp = (event) => {
          if (!startRef.current) return;
          const dx = event.clientX - startRef.current.x;
          const dy = event.clientY - startRef.current.y;
          startRef.current = null;

          if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy)) {
            goByStep(dx < 0 ? 1 : -1);
          }
        };

                  aria-label="Previous car"
                  onClick={() => goByStep(-1)}
                  disabled={isTransitioning}
                  className="liquid-glass shine-hover absolute left-3 top-1/2 z-20 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full border border-white/10 text-white disabled:cursor-not-allowed disabled:opacity-60 sm:left-6 sm:h-11 sm:w-11 lg:left-10"
                  style={{ top: isMobileViewport ? "36%" : "50%" }}
                >
                  <ChevronLeft />
                </button>
                <button
                  type="button"
                  aria-label="Next car"
                  onClick={() => goByStep(1)}
                  disabled={isTransitioning}
                  className="liquid-glass shine-hover absolute right-3 top-1/2 z-20 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full border border-white/10 text-white disabled:cursor-not-allowed disabled:opacity-60 sm:right-6 sm:h-11 sm:w-11 lg:right-10"
                  style={{ top: isMobileViewport ? "36%" : "50%" }}
                >
                  <ChevronRight />
                </button>

                <div ref={viewportRef} className="carousel-viewport absolute inset-0">
                  <div className="absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-[#070707]/80 via-[#070707]/35 to-transparent" aria-hidden="true" />
                  <div className="absolute inset-x-[8%] top-8 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent" aria-hidden="true" />
                  <div className="absolute inset-x-[10%] bottom-[18%] h-px bg-gradient-to-r from-transparent via-white/10 to-transparent" aria-hidden="true" />
                  <div className="absolute left-1/2 top-[21%] h-52 w-[82%] -translate-x-1/2 rounded-full bg-[radial-gradient(circle,rgba(255,255,255,0.08),transparent_68%)] blur-3xl" aria-hidden="true" />

                  <div className="carousel-viewport absolute inset-0">
                    {CARS.map((item, index) => {
                      const offset = resolveOffset(index);
                      const distance = Math.abs(offset);
                      const isFocused = distance === 0;
                      const isAdjacent = distance === 1;
                      const opacity = isFocused ? 1 : isAdjacent ? 0.5 : 0.08;
                      const scale = isFocused ? 1 : isAdjacent ? 0.9 : 0.86;

                      return (
                        <div
                            key={item.id}
                          className="carousel-slide"
                          onClick={() => {
                            lastInteractionRef.current = Date.now();
                            goTo(index);
                          }}
                          style={{
                            left: "50%",
                            top: isMobileViewport ? "36%" : "50%",
                            width: slideWidth ? `${slideWidth}px` : "60%",
                            height: "100%",
                            position: "absolute",
                            opacity,
                            transform: `translate3d(-50%, -50%, 0) translate3d(${offset * stepWidth}px, 0, 0)`,
                            transition: "transform 0.4s ease, opacity 0.4s ease",
                            zIndex: isFocused ? 3 : isAdjacent ? 2 : 1,
                            pointerEvents: isFocused || isAdjacent ? "auto" : "none",
                            willChange: "transform, opacity",
                          }}
                        >
                          <div className="relative flex h-full w-full items-center justify-center">
                            <div
                              className="pointer-events-none absolute bottom-[12%] left-1/2 h-10 w-[70%] -translate-x-1/2 rounded-full blur-3xl"
                              style={{
                                background: item.glowColor,
                                opacity: isFocused ? 1 : 0.55,
                                willChange: "transform",

                                  draggable="false"
                                  loading="eager"
                                  decoding="async"
                                />
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div
                    className="glow-pulse absolute bottom-[16%] left-1/2 h-10 w-[72%] -translate-x-1/2 rounded-full blur-3xl"
                    style={{ background: currentCar.glowColor, willChange: "transform" }}
